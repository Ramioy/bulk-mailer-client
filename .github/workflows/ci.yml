name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # E2E against the real backend (private repository Ramioy/bulk-mailer-backend). Off until the repository has the
  # variable E2E_ENABLED=true and the secret BACKEND_REPO_TOKEN (a fine-grained token with read access to the backend).
  e2e:
    if: ${{ vars.E2E_ENABLED == 'true' }}
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: bulk_mailer
          POSTGRES_PASSWORD: bulk_mailer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bulk_mailer"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BACKEND_DIR: ${{ github.workspace }}/backend
      E2E_DATABASE_URL: postgres://bulk_mailer:bulk_mailer_ci@localhost:5432/bulk_mailer_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Ramioy/bulk-mailer-backend
          ref: main
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
